name: "telegram-forwarder-${BOT_INSTANCE_ID:?Set BOT_INSTANCE_ID to the instance directory name}"

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: telegram-forwarder-bot:local
    restart: unless-stopped
    logging: *logging
    init: true
    working_dir: /app/data/${BOT_INSTANCE_ID}
    command:
      - python
      - -m
      - telegram_forwarder_bot
      - --env
      - /app/data/${BOT_INSTANCE_ID}
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - "${BOT_DATA_ROOT:-./data}/${BOT_INSTANCE_ID}:/app/data/${BOT_INSTANCE_ID}"
    networks:
      - telemetry

networks:
  telemetry:
    name: "${TELEMETRY_NETWORK_NAME:-telegram-forwarder-telemetry}"
    external: true
