name: telegram-forwarder-telemetry

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  influxdb:
    image: influxdb:3-core
    user: "0:0"
    restart: unless-stopped
    logging: *logging
    ports:
      - "${INFLUXDB_BIND_ADDRESS:-0.0.0.0}:${INFLUXDB_HTTP_PORT:-8181}:8181"
    volumes:
      - influxdb_data:/var/lib/influxdb3/data
    command:
      - influxdb3
      - serve
      - --node-id=1
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8181
    networks:
      - telemetry

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    logging: *logging
    ports:
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .compose.env}"
    depends_on:
      - influxdb
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - telemetry

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    logging: *logging
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - telemetry

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    logging: *logging
    ports:
      - "${ALLOY_BIND_ADDRESS:-0.0.0.0}:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./deploy/alloy.config:/etc/alloy/config.alloy:ro
      - "${BOT_DATA_ROOT:-./data}:/var/log/telegram-forwarder-bot:ro"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - telemetry

volumes:
  influxdb_data:
  grafana_data:
  loki_data:

networks:
  telemetry:
    name: "${TELEMETRY_NETWORK_NAME:-telegram-forwarder-telemetry}"
